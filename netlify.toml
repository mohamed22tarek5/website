# Netlify config for eng-mta — mirror of vercel.json
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  base = "."
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["public/**/*.md", "public/**/*.html"]

# api/ (Vercel style) stays for Vercel. netlify/functions/*.mjs (Request -> Response)
# serves the same routes on Netlify. See redirects below.
# NOTE: Vercel `Accept: text/markdown` rewrites (-> /api/markdown?path=...) have no
# netlify.toml equivalent (no header-based rewrites). Use a Netlify Edge Function
# to check the Accept header if you need Markdown negotiation on Netlify.

# --- Global security headers (vercel: /(.*)) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# --- Homepage ---
[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </.well-known/api-catalog/index.json>; rel="api-catalog", </.well-known/agent-card.json>; rel="service-desc", </.well-known/acp.json>; rel="service-desc", </.well-known/mcp/server-card.json>; rel="service-desc", </services.html>; rel="service-doc", </openapi.json>; rel="service-doc", </.well-known/ai-catalog.json>; rel="describedby", </auth.md>; rel="describedby", </.well-known/oauth-protected-resource>; rel="resource-metadata", </.well-known/agent-skills/index.json>; rel="linkset", </sitemap.xml>; rel="sitemap", </manifest.webmanifest>; rel="manifest", </api/x402>; rel="payment", </.well-known/http-message-signatures-directory>; rel="http-message-signatures-directory"'
    Vary = "Accept"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </.well-known/api-catalog/index.json>; rel="api-catalog", </.well-known/agent-card.json>; rel="service-desc", </.well-known/acp.json>; rel="service-desc", </.well-known/mcp/server-card.json>; rel="service-desc", </services.html>; rel="service-doc", </openapi.json>; rel="service-doc", </.well-known/ai-catalog.json>; rel="describedby", </auth.md>; rel="describedby", </.well-known/oauth-protected-resource>; rel="resource-metadata", </.well-known/agent-skills/index.json>; rel="linkset", </sitemap.xml>; rel="sitemap", </manifest.webmanifest>; rel="manifest", </api/x402>; rel="payment", </.well-known/http-message-signatures-directory>; rel="http-message-signatures-directory"'
    Vary = "Accept"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# --- Engineering tools ---
[[headers]]
  for = "/sites/*"
  [headers.values]
    Link = '</.well-known/agent-skills/index.json>; rel="linkset", </sitemap.xml>; rel="sitemap"'
    Vary = "Accept"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# --- CV (long cache) ---
[[headers]]
  for = "/Mohamed_Tarek_Abdelhady_Engineer_CV.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# --- Agent / API discovery (CORS + JSON types) ---
[[headers]]
