  status = 200

[[redirects]]
  from = "/api/oauth-authorization-server"
  to = "/.netlify/functions/oauth-authorization-server"
  status = 200

# Specific before generic: claim before identity
[[redirects]]
  from = "/api/agent/identity/claim"
  to = "/.netlify/functions/agent-identity-claim"
  status = 200

[[redirects]]
  from = "/api/agent/identity"
  to = "/.netlify/functions/agent-identity"
  status = 200

# Friendly paths (same as vercel.json rewrites)
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200

[[redirects]]
