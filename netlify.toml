  [headers.values]
    Content-Type = "application/http-message-signatures-directory+json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"

# Generic CORS for remaining .well-known (must come after specifics)
[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Accept, Accept-Type"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# --- API routes (headers apply once functions are ported) ---
[[headers]]
  for = "/api/x402"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, PAYMENT-SIGNATURE, PAYMENT-REQUIRED, PAYMENT-RESPONSE"
    Cache-Control = "no-store"

[[headers]]
  for = "/agent/identity"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "no-store"

[[headers]]
  for = "/agent/identity/claim"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Cache-Control = "no-store"

# --- SEO ---
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# --- Static assets (vercel regex split per-extension; Netlify has no alternation) ---
