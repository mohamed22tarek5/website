# --- Rewrites (vercel.json -> Netlify status=200) ---
[[redirects]]
  from = "/.well-known/api-catalog"
  to = "/.well-known/api-catalog/index.json"
  status = 200

# API routes -> Netlify Functions (dual-deploy with Vercel api/)
[[redirects]]
  from = "/api/markdown/*"
  to = "/.netlify/functions/markdown?path=/:splat"
  status = 200

[[redirects]]
  from = "/api/markdown"
  to = "/.netlify/functions/markdown"
  status = 200

[[redirects]]
  from = "/api/x402"
  to = "/.netlify/functions/x402"
  status = 200

[[redirects]]
  from = "/api/oauth-protected-resource"
