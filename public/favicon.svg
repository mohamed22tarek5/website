<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#161f36"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#pwaBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="4"/>
  
  <!-- Circuit pins -->
  <g stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="80" y1="180" x2="140" y2="180"/>
    <line x1="80" y1="256" x2="140" y2="256"/>
    <line x1="80" y1="332" x2="140" y2="332"/>
    <line x1="372" y1="180" x2="432" y2="180"/>
    <line x1="372" y1="256" x2="432" y2="256"/>
    <line x1="372" y1="332" x2="432" y2="332"/>
    <line x1="180" y1="80" x2="180" y2="140"/>
    <line x1="256" y1="80" x2="256" y2="140"/>
    <line x1="332" y1="80" x2="332" y2="140"/>
    <line x1="180" y1="372" x2="180" y2="432"/>
    <line x1="256" y1="372" x2="256" y2="432"/>
    <line x1="332" y1="372" x2="332" y2="432"/>
  </g>

  <!-- Central Chip Body -->
  <rect x="140" y="140" width="232" height="232" rx="28" fill="#131b2e" stroke="url(#cyanGlow)" stroke-width="10" filter="url(#glow)"/>
  
  <!-- Notch indicator -->
  <circle cx="180" cy="180" r="12" fill="#38bdf8" opacity="0.9"/>
  
  <!-- Monogram MTA / Circuit lines inside -->
  <path d="M190 320 L190 220 L230 270 L270 220 L270 320" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 220 L350 220 M320 220 L320 320" fill="none" stroke="#818cf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>