<body>
<header class="mta-bar" id="header" role="banner">
  <div class="mta-bar-in">

</header>
<div class="wrap">
  <div class="hero"><span class="pill">Timers · NE555 / LM555</span><h1>555 Timer Calculator</h1><p>Design astable oscillators and monostable one-shots. Live frequency, duty, pulse width and practical checks.</p></div>
  <div class="seg"><button class="on" id="bA">Astable</button><button id="bM">Monostable</button></div>
  <div class="grid">
    <div class="card">
      <h2><i class="fas fa-sliders"></i> Inputs</h2>
      <div id="ast">
        <div class="row"><input id="r1" type="number" value="10" step="any" min="0"><select id="r1u"><option value="1e3" selected>kΩ</option><option value="1">Ω</option><option value="1e6">MΩ</option></select></div>
        <label class="lbl">R1 (charge resistor)</label>
        <div class="row"><input id="r2" type="number" value="10" step="any" min="0"><select id="r2u"><option value="1e3" selected>kΩ</option><option value="1">Ω</option><option value="1e6">MΩ</option></select></div>
        <label class="lbl">R2 (discharge resistor)</label>
        <div class="row"><input id="cap" type="number" value="10" step="any" min="0"><select id="capu"><option value="1e-6" selected>µF</option><option value="1e-9">nF</option><option value="1e-12">pF</option><option value="1e-3">mF</option></select></div>
        <label class="lbl">C1 timing capacitor</label>
      </div>
      <div id="mon" style="display:none">
        <div class="row"><input id="rm" type="number" value="10" step="any" min="0"><select id="rmu"><option value="1e3" selected>kΩ</option><option value="1">Ω</option><option value="1e6">MΩ</option></select></div>
        <label class="lbl">R timing resistor</label>
        <div class="row"><input id="cm" type="number" value="10" step="any" min="0"><select id="cmu"><option value="1e-6" selected>µF</option><option value="1e-9">nF</option><option value="1e-12">pF</option></select></div>
        <label class="lbl">C timing capacitor</label>
      </div>
      <button class="btn" id="go"><i class="fas fa-bolt"></i> Calculate</button>
      <div class="formula" id="fml">f = 1.44 / ((R1+2·R2)·C)</div>
    </div>
    <div class="card"><h2><i class="fas fa-wave-square"></i> Results</h2>
      <div class="res" id="res"></div>
      <div class="bar" id="dutybar" title="Duty visual"><div class="bh" id="dh"></div><div class="bl" id="dl"></div></div>
      <div class="note" id="note"></div>
    </div>
  </div>

</div>
<script>
const $=id=>document.getElementById(id);
$('th').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='light'?'dark':'light';};
let mode='a';
$('bA').onclick=()=>{mode='a';$('bA').classList.add('on');$('bM').classList.remove('on');$('ast').style.display='';$('mon').style.display='none';$('fml').textContent='f = 1.44 / ((R1+2·R2)·C)   ·   TH=0.693(R1+R2)C   ·   TL=0.693·R2·C';calc();};
$('bM').onclick=()=>{mode='m';$('bM').classList.add('on');$('bA').classList.remove('on');$('ast').style.display='none';$('mon').style.display='';$('fml').textContent='T = 1.1 · R · C  (output HIGH pulse width)';calc();};
function fmtT(s){if(!isFinite(s)||s<0)return'–';if(s<1e-6)return(s*1e9).toFixed(1)+' ns';if(s<1e-3)return(s*1e6).toFixed(2)+' µs';if(s<1)return(s*1e3).toFixed(2)+' ms';if(s<60)return s.toFixed(3)+' s';return (s/60).toFixed(2)+' min';}
function fmtF(f){if(!isFinite(f)||f<0)return'–';if(f>=1e6)return(f/1e6).toFixed(4)+' MHz';if(f>=1e3)return(f/1e3).toFixed(4)+' kHz';return f.toFixed(3)+' Hz';}
function calc(){
  if(mode==='a'){
    const R1=parseFloat($('r1').value)*parseFloat($('r1u').value),R2=parseFloat($('r2').value)*parseFloat($('r2u').value),C=parseFloat($('cap').value)*parseFloat($('capu').value);
    if(!(R1>0&&R2>0&&C>0)){$('note').textContent='Enter R1, R2, C > 0.';$('res').innerHTML='';return;}
    const TH=0.693*(R1+R2)*C,TL=0.693*R2*C,T=TH+TL,f=1.44/((R1+2*R2)*C),d=100*TH/T;
    $('res').innerHTML=`<div class="cell hl"><small>Frequency</small><b>${fmtF(f)}</b></div><div class="cell"><small>Period</small><b>${fmtT(T)}</b></div><div class="cell"><small>T HIGH</small><b>${fmtT(TH)}</b></div><div class="cell"><small>T LOW</small><b>${fmtT(TL)}</b></div><div class="cell"><small>Duty cycle</small><b>${d.toFixed(2)} %</b></div><div class="cell"><small>Mark:Space</small><b>${(TH/TL).toFixed(2)} : 1</b></div>`;
    $('dh').style.width=d+'%';$('dl').style.width=(100-d)+'%';$('dutybar').style.display='flex';
    let w=[];if(R1<1000)w.push('R1 < 1kΩ — use ≥1kΩ to protect discharge pin.');if(d<=50)w.push('Standard astable cannot go below 50% duty — add diode across R2 for <50%.');if(f>100e3)w.push('f > 100kHz — use CMOS 7555 for accuracy.');if(C<1e-9)w.push('C < 1nF — stray capacitance will dominate.');
    $('note').innerHTML=(w.length?'<span style="color:var(--warn)">⚠ '+w.join('<br>')+'</span><br>':'<span style="color:var(--ok)">✓ Practical values.</span><br>')+'T<sub>H</sub>=0.693(R1+R2)C · T<sub>L</sub>=0.693·R2·C · standard duty always >50%.';
  }else{
    const R=parseFloat($('rm').value)*parseFloat($('rmu').value),C=parseFloat($('cm').value)*parseFloat($('cmu').value);
    if(!(R>0&&C>0)){$('note').textContent='Enter R, C > 0.';$('res').innerHTML='';return;}
    const T=1.1*R*C;
    $('res').innerHTML=`<div class="cell hl"><small>Pulse width</small><b>${fmtT(T)}</b></div><div class="cell"><small>Max retrigger rate</small><b>${fmtF(1/(T||1))}</b></div><div class="cell"><small>R</small><b>${R>=1e6?(R/1e6)+' MΩ':R>=1e3?(R/1e3)+' kΩ':R+' Ω'}</b></div><div class="cell"><small>C</small><b>${C>=1e-6?(C*1e6)+' µF':(C*1e9)+' nF'}</b></div>`;
    $('dutybar').style.display='none';
    $('note').innerHTML='Trigger with a <1/3 Vcc negative pulse. Add 10nF from pin 5 to GND for noise immunity.';
  }
}
$('go').onclick=calc;document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));calc();
</script>
